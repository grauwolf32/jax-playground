[tool.poetry]
name = "jax-playground"
version = "0.1.0"
description = "JAX-native physics environments + PPO. Hyrosphere, linearsphere, pursuit, gathering — all vectorized via jax.vmap, jit-compiled, end-to-end on GPU."
authors = ["grauwolf32"]
readme = "README.md"
packages = [{ include = "jax_playground" }]

[tool.poetry.dependencies]
python = "^3.12"
# jax / flax bumped for Python 3.14 compatibility (flax<0.11 trips on the
# PEP 749 __annotations__ change). cuda12 plugin pinned alongside jaxlib.
jax = { version = ">=0.10", extras = ["cuda12"] }
flax = ">=0.12"
optax = "^0.2.4"
chex = "^0.1.86"
numpy = "^2.1"
tensorboard = "^2.18"
setuptools = ">=75,<84"          # tensorboard imports pkg_resources
tqdm = "^4.66"
# Viewer dependencies (optional, only used by viewer.py — not needed for training).
pygame-ce = "^2.5"     # community fork — mainline pygame 2.6 breaks pg.font on Python 3.14
PyOpenGL = "^3.1.7"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
